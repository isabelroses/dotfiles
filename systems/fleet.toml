# facts about every host, and the garden.services each one runs. every host
# reads all of this, so no host has to evaluate another to learn about it.
# anything that needs nix (config, lib, pkgs) stays in systems/<host>/default.nix

[amaterasu]
wakeOnLan = "enp4s0"

[freyja]
wakeOnLan = "enp6s0"
# behind a home NAT
relay = { via = "minerva", services = ["immich", "jellyfin"] }

[freyja.services]
arr.enable = true
borgbackup.enable = true
immich = { enable = true, host = "0.0.0.0" }
jellyfin.enable = true
lethe = { enable = true, host = "0.0.0.0" }

[freyja.services.home-assistant]
enable = true
radio = "/dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_a8ad9d6a37a1ef11b4e1976661ce3355-if00-port0"

[isis.services]
gatus = { enable = true, isPersonal = false }
nginx = { enable = true, domain = "tgirl.cloud" }

[minerva]
ipv4 = "91.107.198.173"
ipv6 = "2a01:4f8:c012:2f67::1"

[minerva.services]
blahaj.enable = true
borgbackup.enable = true
isabelroses-website.enable = true
kanidm.enable = true
mailserver.enable = true
quoteit.enable = true
vaultwarden.enable = true
# web
nginx.enable = true
# dev
atuin.enable = true
forgejo.enable = true
snot.enable = true
wakapi.enable = true
# social
matrix.enable = true
nixpkgs-prs-bot = { enable = true, bsky.enable = true }
tranquil.enable = true
# databases
postgresql.enable = true
redis.enable = true

[skadi]
ipv4 = "10.0.0.11"
ipv6 = "2603:c020:c011:9c00:0:c069:1ff7:1ff3"

[skadi.services]
gatus.enable = true
nginx.enable = true
pds.enable = true
piper.enable = true
